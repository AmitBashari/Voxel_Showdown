<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Voxel Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--me:#3b82f6;--op:#ef4444;--ol:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 4px 0 #000}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#1a2550,#070a16);overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#4fa9e6 0%,#94d2f5 45%,#d4f1fd 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.lf{font-family:'Lilita One',Impact,'Arial Black',sans-serif;letter-spacing:.4px}
.hidden{display:none!important}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 7px 0;pointer-events:none;z-index:5;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
.pc{display:flex;gap:6px;align-items:center;background:linear-gradient(180deg,#0b1430ee,#0b1430bb);border:2px solid #ffffff2a;border-radius:12px;padding:5px 7px;min-width:0;width:41%}
.pc.op{flex-direction:row-reverse;text-align:right}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:19px 'Lilita One',Impact,sans-serif;flex:none;box-shadow:inset 0 -4px 0 #0005,0 2px 0 #0006;border:2px solid #fff}
.me .av,.av.me{background:var(--me)}.op .av,.av.op{background:var(--op)}
.pinfo{min-width:0;flex:1}
.pn{font:13px 'Lilita One',Impact,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{display:flex;gap:2px;margin:2px 0}
.op .hearts{justify-content:flex-end}
.heart{width:15px;height:13px;color:#ff3b5c;display:block;filter:drop-shadow(0 1px 0 #000)}
.heart svg{width:100%;height:100%;display:block}
.heart.lost{color:#3a3f55}
.heart.breaking{animation:hb .7s ease-out}
@keyframes hb{0%{transform:scale(1)}25%{transform:scale(2) rotate(-14deg);color:#fff}60%{transform:scale(.6) rotate(10deg)}100%{transform:scale(1)}}
.sub{font-size:11px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.op .sub{justify-content:flex-end}
.chips{display:flex;gap:3px}
.chip{font-size:12px;line-height:1;background:#ffffff22;border-radius:5px;padding:2px 3px;position:relative;animation:chipIn .4s cubic-bezier(.2,1.6,.4,1)}
.chip b{font-size:8px;position:absolute;right:-4px;bottom:-5px;background:#ffc83d;color:#000;border-radius:4px;padding:0 2px}
@keyframes chipIn{from{transform:scale(0)}}
.mid{text-align:center;padding-top:3px;flex:1;min-width:0}
#roundLbl{font:15px 'Lilita One',Impact,sans-serif;background:#000b;border-radius:8px;padding:4px 7px;white-space:nowrap;display:inline-block}
#opStatus{font-size:9.5px;margin-top:4px;color:#ffd76a;min-height:12px;font-weight:700}
#opStatus.ready{color:#7dffa0}

/* draft */
#draft{position:absolute;left:0;right:0;bottom:0;padding:26px 10px calc(12px + env(safe-area-inset-bottom));z-index:6;background:linear-gradient(0deg,#060a1ef5 62%,#060a1e00);transform:translateY(110%);transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
#draft.on{transform:none}
.dh{display:flex;align-items:center;gap:8px;margin:0 2px 9px}
#pickLbl{font:18px 'Lilita One',Impact,sans-serif;text-shadow:var(--ol)}
.tm{flex:1;height:10px;background:#ffffff22;border-radius:6px;overflow:hidden;border:1px solid #ffffff33}
#timerBar{height:100%;width:100%;background:linear-gradient(90deg,#5eea7a,#b6f36a);border-radius:6px}
#timerBar.low{background:linear-gradient(90deg,#ff4d4d,#ff9a3d)}
#timerNum{font:16px 'Lilita One',Impact,sans-serif;width:22px;text-align:right}
#cards{display:flex;gap:8px;perspective:800px}
.card{flex:1;min-width:0;position:relative;aspect-ratio:3/4.3;border-radius:14px;padding:3px;cursor:pointer;isolation:isolate;animation:deal .5s var(--d,0s) cubic-bezier(.2,1.5,.4,1) both;transform-origin:50% 100%}
.card .inner{position:relative;height:100%;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:5px 5px 6px;text-align:center}
.r-common{background:linear-gradient(180deg,#c3cbd8,#6b7486)}
.r-common .inner{background:linear-gradient(180deg,#3a4256,#232838)}
.r-rare{background:linear-gradient(180deg,#7fe0ff,#2a74ff);box-shadow:0 0 14px #2a9dff88}
.r-rare .inner{background:linear-gradient(180deg,#1d4f9e,#0f2a5c)}
.r-epic{background:conic-gradient(from var(--ang),#c050ff,#ff6ad5,#7a3cff,#ff6ad5,#c050ff);animation:deal .5s var(--d,0s) cubic-bezier(.2,1.5,.4,1) both,spinA 2.6s linear infinite,glowE 1.4s ease-in-out infinite}
.r-epic .inner{background:radial-gradient(circle at 50% 30%,#7b2fc9,#3a1170 70%)}
.r-legend{background:conic-gradient(from var(--ang),#fff3b0,#ffb81f,#ff7a00,#fff,#ffd23d,#ff9d00,#fff3b0);animation:legDeal .8s var(--d,0s) cubic-bezier(.2,1.6,.4,1) both,spinA 1.8s linear infinite,glowL 1s ease-in-out infinite}
.r-legend .inner{background:radial-gradient(circle at 50% 30%,#d4861a,#5a2a05 75%)}
.rays{display:none}
.r-legend .rays{display:block;position:absolute;inset:-30%;z-index:-1;border-radius:50%;background:repeating-conic-gradient(from var(--ang),#ffe38aaa 0 8deg,transparent 8deg 24deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spinA 6s linear infinite;pointer-events:none}
@keyframes spinA{to{--ang:360deg}}
@keyframes glowE{50%{box-shadow:0 0 24px #c050ffcc,0 0 4px #fff}}
@keyframes glowL{0%,100%{box-shadow:0 0 18px #ffb81faa}50%{box-shadow:0 0 40px #ffd23d,0 0 8px #fff}}
@keyframes deal{0%{transform:translateY(60px) rotateY(90deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes legDeal{0%{transform:translateY(-160px) scale(1.9) rotate(-10deg);opacity:0}60%{transform:translateY(6px) scale(.95);opacity:1}100%{transform:none;opacity:1}}
.shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff45 50%,transparent 60%);transform:translateX(-120%);animation:shine 2.4s ease-in-out infinite;pointer-events:none}
.r-common .shine{display:none}
@keyframes shine{0%,40%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
.spk{position:absolute;width:7px;height:7px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 1.6s infinite;opacity:0;pointer-events:none}
@keyframes tw{50%{opacity:1;transform:scale(1.5) rotate(45deg)}}
.ctop{display:flex;justify-content:space-between;width:100%;font-size:8px;font-weight:800;letter-spacing:.4px}
.rar{padding:1px 4px;border-radius:4px;background:#0007}
.r-rare .rar{color:#8fe3ff}.r-epic .rar{color:#f4b0ff}.r-legend .rar{color:#ffe14d}
.tag{opacity:.75;padding-top:1px}
.art{height:40%;width:100%;display:grid;place-items:center;position:relative;margin-top:2px}
.art img{height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 3px 0 #0007)}
.emo{font-size:38px;line-height:1;filter:drop-shadow(0 3px 0 #0007)}
.x2b{position:absolute;right:2px;bottom:0;font:18px 'Lilita One',Impact,sans-serif;color:#ffe14d;text-shadow:var(--ol)}
.amt{font:23px/1 'Lilita One',Impact,sans-serif;text-shadow:var(--ol);margin-top:3px}
.r-legend .amt{color:#ffe68a}
.nm{font:13px/1.1 'Lilita One',Impact,sans-serif;text-shadow:0 2px 0 #0008;margin-top:2px}
.ds{font-size:9.5px;line-height:1.2;opacity:.88;margin-top:3px}
.card.picked{animation:pickA .45s ease-in forwards!important;z-index:2}
.card.gone{animation:goneA .3s ease-in forwards!important}
@keyframes pickA{0%{transform:scale(1)}35%{transform:scale(1.15) translateY(-8px)}100%{transform:scale(.4) translateY(-280px);opacity:0}}
@keyframes goneA{to{transform:translateY(70px) scale(.8);opacity:0}}

/* overlays */
#ov{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#050816b8;text-align:center}
#ov.show{display:flex}
#ov.clear{background:transparent;pointer-events:none}
.btn{font:26px 'Lilita One',Impact,sans-serif;color:#fff;background:linear-gradient(#ffcf3d,#ff9a1f);border:3px solid #fff;border-radius:16px;padding:12px 40px;box-shadow:0 6px 0 #b45309,0 12px 24px #0008;text-shadow:0 2px 0 #b45309;cursor:pointer;animation:pulse 1.3s ease-in-out infinite;pointer-events:auto}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b45309}
@keyframes pulse{50%{transform:scale(1.06)}}
.title{display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px}
.logo{font:58px/.92 'Lilita One',Impact,sans-serif;color:#ffd23d;text-shadow:0 4px 0 #c2410c,0 8px 0 #000,0 0 30px #ff9d0088;transform:rotate(-4deg);animation:logoIn .8s cubic-bezier(.2,1.6,.4,1)}
.logo span{color:#fff;text-shadow:0 4px 0 #1d4ed8,0 8px 0 #000}
@keyframes logoIn{from{transform:scale(0) rotate(-30deg)}}
.tagl{font:16px 'Lilita One',Impact,sans-serif;text-shadow:0 2px 0 #000}
.how{font-size:12px;opacity:.85;max-width:280px;line-height:1.4}
.mm{display:flex;flex-direction:column;align-items:center;gap:14px}
.mm-t{font:24px 'Lilita One',Impact,sans-serif;text-shadow:var(--ol)}
.spin{width:54px;height:54px;border:6px solid #ffffff33;border-top-color:#ffd23d;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.mm-n{font:20px 'Lilita One',Impact,sans-serif;color:#ffd23d;min-height:26px}
.mm-s{font-size:12px;opacity:.75}
.vs{display:flex;align-items:center;gap:14px}
.vsp{display:flex;flex-direction:column;align-items:center;gap:6px;width:120px}
.vsp .av{width:74px;height:74px;font-size:36px;border-width:3px;border-radius:16px}
.vsp.me{animation:inL .5s cubic-bezier(.2,1.4,.4,1) both}.vsp.op{animation:inR .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes inL{from{transform:translateX(-200px)}}@keyframes inR{from{transform:translateX(200px)}}
.vn{font:17px 'Lilita One',Impact,sans-serif;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt{font-size:12px;opacity:.85}
.vsx{font:46px 'Lilita One',Impact,sans-serif;color:#ffd23d;text-shadow:var(--ol);animation:vsIn .5s .35s cubic-bezier(.2,1.8,.4,1) both}
@keyframes vsIn{from{transform:scale(4);opacity:0}}
.res-t{font:68px 'Lilita One',Impact,sans-serif;text-shadow:var(--ol),0 0 40px #0008;animation:resIn .6s cubic-bezier(.2,1.6,.4,1) both}
.res.win .res-t{color:#ffd23d}.res.lose .res-t{color:#ff5a6e}.res.draw .res-t{color:#d0d6e6}
.res-s{font:18px 'Lilita One',Impact,sans-serif;text-shadow:var(--ol);margin-top:6px;animation:resIn .5s .2s both}
@keyframes resIn{from{transform:scale(2.6);opacity:0}}
.over{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px}
.ov-t{font:56px/1 'Lilita One',Impact,sans-serif;text-shadow:var(--ol);animation:resIn .6s cubic-bezier(.2,1.6,.4,1) both}
.over.win .ov-t{color:#ffd23d}.over.lose .ov-t{color:#ff5a6e}
.ov-s{font:17px 'Lilita One',Impact,sans-serif}
.ov-tr{font:22px 'Lilita One',Impact,sans-serif;background:#0007;border-radius:12px;padding:8px 16px}
.ov-st{font-size:12px;opacity:.8}

#big{position:absolute;left:0;right:0;top:36%;text-align:center;font:90px 'Lilita One',Impact,sans-serif;z-index:8;pointer-events:none;opacity:0;text-shadow:var(--ol),0 0 30px #0007}
#big.pop{animation:bigpop .6s ease-out forwards}
#big.fight{color:#ffd23d;animation:bigfight 1s ease-out forwards}
@keyframes bigpop{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}75%{opacity:1}100%{transform:scale(.8);opacity:0}}
@keyframes bigfight{0%{transform:scale(3) rotate(-8deg);opacity:0}20%{transform:scale(1) rotate(-4deg);opacity:1}70%{opacity:1;transform:scale(1.05) rotate(-4deg)}100%{transform:scale(1.6) rotate(-4deg);opacity:0}}
#banner{position:absolute;top:17%;left:0;right:0;z-index:8;pointer-events:none}
.bn{display:flex;align-items:center;gap:10px;padding:8px 22px;width:88%;opacity:0}
.bn.me{background:linear-gradient(90deg,#1d4ed8,#3b82f6dd 70%,#3b82f600);animation:bnL 1.5s both}
.bn.op{flex-direction:row-reverse;text-align:right;margin-left:auto;background:linear-gradient(270deg,#b91c1c,#ef4444dd 70%,#ef444400);animation:bnR 1.5s both}
.bi{font-size:40px;filter:drop-shadow(0 3px 0 #0008)}
.bw{font-size:11px;font-weight:800;opacity:.9;letter-spacing:1px}
.bt{font:30px/1 'Lilita One',Impact,sans-serif;text-shadow:var(--ol)}
@keyframes bnL{0%{transform:translateX(-100%) skewX(-10deg);opacity:1}14%{transform:translateX(0) skewX(-10deg);opacity:1}80%{transform:translateX(3%) skewX(-10deg);opacity:1}100%{transform:translateX(25%) skewX(-10deg);opacity:0}}
@keyframes bnR{0%{transform:translateX(100%) skewX(10deg);opacity:1}14%{transform:translateX(0) skewX(10deg);opacity:1}80%{transform:translateX(-3%) skewX(10deg);opacity:1}100%{transform:translateX(-25%) skewX(10deg);opacity:0}}
#waitPanel{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#0b1430f2;border:2px solid #ffffff30;border-radius:14px;padding:10px 16px;z-index:7;white-space:nowrap;box-shadow:0 10px 30px #0009;animation:wpIn .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes wpIn{from{transform:translate(-50%,40px);opacity:0}}
#waitPanel .av{animation:pulse 1s infinite}
#waitPanel.ready{border-color:#7dffa0}
.wt{font:16px 'Lilita One',Impact,sans-serif}
.ws{font-size:11px;opacity:.85;margin-top:2px}
.dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font:16px 'Lilita One',Impact,sans-serif;color:#fff;text-shadow:var(--ol);animation:ftUp 1.05s ease-out forwards;white-space:nowrap}
.ft.bonk{color:#ffe14d;font-size:22px}.ft.warn{color:#ffc0c0;font-size:14px}.ft.gold{color:#ffd23d;font-size:24px}.ft.pow{font-size:20px}.ft.out{color:#9be7ff;font-size:19px}.ft.add{color:#8cffa0;font-size:20px}.ft.dmg{color:#ffd0a0;font-size:15px}.ft.ab{color:#f4b0ff;font-size:20px}
@keyframes ftUp{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}15%{transform:translate(-50%,-60%) scale(1.25);opacity:1}30%{transform:translate(-50%,-70%) scale(1)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font:18px 'Lilita One',Impact,sans-serif;text-shadow:var(--ol);z-index:9;pointer-events:none;opacity:0}
#toast.on{animation:toastA 1.2s ease-out}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,10px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* clarity: intel, counters, report */
.intel{display:flex;align-items:center;gap:5px;font-size:10px;margin:0 2px 12px;flex-wrap:wrap;min-height:20px}
.intel>b{color:#ff9aa4;font-weight:800;letter-spacing:.6px;margin-right:2px}
.intel .unk{opacity:.65}
.ic{display:flex;align-items:center;gap:2px;background:#ff4a5a26;border:1px solid #ff4a5a55;border-radius:6px;padding:0 5px 0 1px;font-weight:800;font-size:11px}
.ic img{width:19px;height:19px;object-fit:contain}
.ic.ab{padding:1px 4px;font-size:12px}
.cx{display:flex;gap:4px;justify-content:center;margin-top:3px}
.cx span{display:flex;align-items:center;gap:1px;font-size:8px;font-weight:800;border-radius:5px;padding:1px 3px 1px 2px;letter-spacing:.2px}
.cx .st{background:#2bd46a33;color:#7dffa0}.cx .wk{background:#ff4a5a33;color:#ffa0aa}
.cx img{width:15px;height:15px;object-fit:contain}
.badge{position:absolute;left:50%;top:-10px;transform:translateX(-50%);white-space:nowrap;font:10px 'Lilita One',Impact,sans-serif;padding:2px 7px;border-radius:7px;z-index:3;box-shadow:0 2px 0 #0008;letter-spacing:.3px;animation:badgeIn .5s .45s cubic-bezier(.2,1.8,.4,1) both}
.badge.good{background:#2bd46a;color:#03301a}.badge.bad{background:#ff4a5a;color:#fff}.badge.combo{background:#b14bff;color:#fff}
@keyframes badgeIn{from{transform:translateX(-50%) scale(0)}}
#ov.rep-on{background:#050816cc}
.rep{width:92%;max-width:380px;background:linear-gradient(180deg,#121c40,#0a1027);border:2px solid #ffffff2a;border-radius:16px;padding:12px 12px 14px;text-align:left;box-shadow:0 20px 50px #000a;animation:repIn .35s cubic-bezier(.2,1.4,.4,1);max-height:94%;overflow:auto}
@keyframes repIn{from{transform:translateY(40px) scale(.95);opacity:0}}
.rp-h{display:flex;justify-content:space-between;align-items:baseline}
.rp-t{font:30px 'Lilita One',Impact,sans-serif;text-shadow:var(--ol)}
.rep.win .rp-t{color:#ffd23d}.rep.lose .rp-t{color:#ff5a6e}.rep.draw .rp-t{color:#d0d6e6}
.rp-r{font-size:11px;opacity:.7;font-weight:800;letter-spacing:.5px}
.rp-sub{font-size:12px;opacity:.85;margin:2px 0 8px}
.rp-mvp{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#ffd23d33,#ffd23d08);border:1px solid #ffd23d66;border-radius:10px;padding:4px 8px;font-size:11px}
.rp-mvp img{width:36px;height:36px;object-fit:contain}
.rp-mvp b{font:15px 'Lilita One',Impact,sans-serif;color:#ffd23d;display:block;letter-spacing:.3px}
.rp-sec{font-size:10px;font-weight:800;letter-spacing:1px;opacity:.6;margin:10px 0 3px}
.rp-row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:7px;font-size:12.5px;padding:3px 5px;border-radius:7px}
.rp-row:nth-child(even){background:#ffffff09}
.rp-row img{width:26px;height:26px;object-fit:contain}
.rp-row .nm2{font-weight:700}.rp-row .by{display:block;font-size:10.5px;color:#ffa0aa;font-weight:600}.rp-row .by.good{color:#7dffa0}
.rp-row .sv{font-weight:800;text-align:right;white-space:nowrap}.sv.dead{color:#ff7a88}.sv.ok{color:#7dffa0}.sv.mid{color:#ffd76a}
.rp-row .sv small{display:block;font-size:10px;font-weight:600;opacity:.8;color:#fff}
.rp-chips{display:flex;gap:5px;flex-wrap:wrap}
.rp-chip{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:800;background:#ff4a5a1f;border-radius:6px;padding:1px 6px 1px 2px}
.rp-chip img{width:20px;height:20px;object-fit:contain}
.rp-ab{font-size:12px;padding:2px 4px;display:flex;gap:7px;align-items:center}
.rp-ab span{font-size:15px}.rp-ab.op{color:#ffb8c0}.rp-ab.me{color:#bfe6ff}
.rp-tip{margin-top:10px;background:#2bd46a1c;border:1px solid #2bd46a66;border-radius:10px;padding:7px 9px;font-size:12.5px;line-height:1.35}
.rp-tip b{color:#7dffa0}
.rp-foot{display:flex;flex-direction:column;align-items:center;margin-top:12px}
.btn.sm{font-size:18px;padding:8px 28px;animation:none;border-radius:12px}
.rp-bar{width:60%;height:3px;background:#ffffff22;border-radius:2px;margin-top:9px;overflow:hidden}.rp-bar i{display:block;height:100%;background:#ffd23d;width:100%}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:20;background:#070a16}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="fx"></div>
  <div id="hud">
    <div class="pc me">

function layoutSlots(team,R){

 for(const t of ORDER){const n=R[t];out[t]=[];if(!n)continue;const f=FORM[t];let i=0;
  while(i<n){const rn=Math.min(f.per,n-i);z+=f.sz*.5;for(let k=0;k<rn;k++)out[t].push({x:(k-(rn-1)/2)*f.sx,z:sg*z});z+=f.sz*.5;i+=rn;}}
 return out;
}

function validCard(team,c,troopsOnly){
 const R=G.roster[team],room=MAX_UNITS-total(R);
 if(troopsOnly&&c.k!=='troop')return false;
 if(c.k==='troop')return room>0;
 if(c.k==='x2')return room>0&&R[c.t]>=2;
 return true;
}
function rollRarity(){
 const r=G.round;const w={common:Math.max(18,58-9*(r-1)),rare:30,epic:9+5*(r-1),legend:3+3*(r-1)};
 let s=0;for(const k in w)s+=w[k];let x=Math.random()*s;for(const k in w){x-=w[k];if(x<=0)return k;}return'common';
}
function genCards(team,troopsOnly){
 const out=[],used=new Set();
 for(let i=0;i<3;i++){
  const want=rollRarity();const tries=[want,...RORDER.filter(r=>r!==want).sort((a,b)=>RORDER.indexOf(b)-RORDER.indexOf(a))];
  let got=null;
  for(const r of tries){const opts=POOL.filter(c=>c.r===r&&!used.has(c.id)&&validCard(team,c,troopsOnly));if(opts.length){got=pick(opts);break;}}
  if(!got){const opts=POOL.filter(c=>!used.has(c.id)&&c.k==='ab');got=pick(opts);}
  used.add(got.id);out.push(got);
 }
 return out;
}
function cardScore(team,c){
 const R=G.roster[team],room=MAX_UNITS-total(R);
 const S=G.seen[0]||{},cm=t=>1+.07*Math.min(S[PREY[t]]||0,12)-.035*Math.min(S[PRED[t]]||0,12);
 if(c.k==='troop')return Math.min(c.n,room)*DEFS[c.t].value*cm(c.t);
 if(c.k==='x2')return Math.min(R[c.t],room)*DEFS[c.t].value*cm(c.t);
 return{rare:7,epic:11,legend:17}[c.r]*(G.abil[team][c.a]?.8:1)*(total(R)<6?.5:1);
}
function aiChoose(cards){
 if(Math.random()<.3)return pick(cards);
 let best=cards[0],bs=-1;for(const c of cards){const s=cardScore(1,c)*rand(.85,1.15);if(s>bs){bs=s;best=c;}}return best;
}
function applyCard(team,c){
 const R=G.roster[team],room=MAX_UNITS-total(R);
 if(c.k==='troop'){const n=Math.min(c.n,room);R[c.t]+=n;return{t:c.t,n};}
 if(c.k==='x2'){const n=Math.min(R[c.t],room);R[c.t]+=n;return{t:c.t,n};}
 G.abil[team][c.a]=(G.abil[team][c.a]||0)+1;return{a:c.a};
}

  collideUnits();updateProjectiles(h);updateDebris(h);
  for(let i=effects.length-1;i>=0;i--)if(effects[i].update(h))effects.splice(i,1);
  for(let i=pending.length-1;i>=0;i--){const p=pending[i];p.delay-=h;if(p.delay<=0){pending.splice(i,1);blast(p.x,p.y,p.z,p.R,p.dmg,p.force,p.team,p.src);}}
 }
 if(units.some(u=>!u.alive))units=units.filter(u=>u.alive);
 for(const u of units)postUnit(u,dt);
 lit.update(dt);glow.update(dt);updateImpacts(rdt);updateArena(rdt);
 boomLight.intensity*=Math.exp(-8*rdt);
 for(const c of clouds){if(c.sat){c.m.userData.bob+=rdt*.6;c.m.position.y=c.y+Math.sin(c.m.userData.bob)*.6;}else{c.m.position.x+=c.sp*rdt;if(c.m.position.x>60)c.m.position.x=-60;}}
 if(G.phase==='fight'){
  G.battleT+=dt;const a=aliveCount(0),b=aliveCount(1);
  if((a===0||b===0||G.battleT>75)&&G.endT<0)G.endT=0;
  if(G.endT>=0){G.endT+=rdt;
   if(G.endT>1.3||G.battleT>75){
    const a2=aliveCount(0),b2=aliveCount(1);let w;

   }}
 }

}

}
function keyName(k){
 if(DEFS[k])return DEFS[k].name;if(k.startsWith('ab:'))return ABIL[k.slice(3)].name;
 return{debris:'flying debris',bump:'collisions',fall:'falls',ringout:'ring-outs',self:'self-destruct',friendly:'friendly fire',other:'the chaos'}[k]||k;
}
function topKey(o,skip){let best=null,bv=0;for(const k in o){if(skip&&skip.includes(k))continue;if(o[k]>bv){bv=o[k];best=k;}}return best;}
function aliveByType(team){const r=emptyRoster();for(const u of units)if(u.alive&&!u.doomed&&u.team===team)r[u.type]++;return r;}
function buildReport(w){
 const st=G.st||newStats(),R0=G.seen[0]||G.roster[0],R1=G.seen[1]||G.roster[1],A0=aliveByType(0),A1=aliveByType(1);
 const cls=w===0?'win':w===1?'lose':'draw',txt=w===0?'VICTORY':w===1?'DEFEAT':'DRAW';
 const sub=w===0?`${G.oppName} loses a heart`:w===1?'You lose a heart':'Both lose a heart';
 // MVP
 let mvp=null;for(const t of[0,1])for(const ty of ORDER){const k=st.kills[t][ty];if(k>0&&(!mvp||k>mvp.k))mvp={t,ty,k};}
 let h=`<div class="rep ${cls}"><div class="rp-h"><span class="rp-t">${txt}</span><span class="rp-r">ROUND ${G.round}</span></div><div class="rp-sub">${sub}</div>`;
 if(mvp)h+=`<div class="rp-mvp"><img src="${ICONS[mvp.ty]||''}" alt=""><div><b>MVP · ${mvp.t===0?'Your':'Their'} ${DEFS[mvp.ty].name}</b>${mvp.k} kills${mvp.ty&&PREY[mvp.ty]&&st.by[1-mvp.t][PREY[mvp.ty]]&&st.by[1-mvp.t][PREY[mvp.ty]][mvp.ty]?` · counter-killed ${st.by[1-mvp.t][PREY[mvp.ty]][mvp.ty]} ${DEFS[PREY[mvp.ty]].name}`:''}</div></div>`;
 h+='<div class="rp-sec">YOUR ARMY</div>';
 for(const ty of ORDER){const tot=R0[ty];if(!tot)continue;const al=A0[ty],k=st.kills[0][ty],by=st.by[0][ty]||{},kk=topKey(by,['self']);
  const r=al/tot,cl=r===0?'dead':r<.5?'mid':'ok';
  let line='';if(kk&&tot-al>0)line=`<span class="by">${tot-al} lost · mostly to ${DEFS[kk]?'their ':''}${keyName(kk)}</span>`;else if(tot-al===0)line=`<span class="by good">no losses</span>`;
  if(ty==='bomber'&&by.self)line=`<span class="by good">${by.self} detonated</span>`+(kk?`<span class="by">${(tot-al)-(by.self||0)} lost to ${DEFS[kk]?'their ':''}${keyName(kk)}</span>`:'');
  h+=`<div class="rp-row"><img src="${ICONS[ty]||''}" alt=""><div><span class="nm2">${DEFS[ty].name}</span>${line}</div><div class="sv ${cl}">${al}/${tot}<small>${k} kill${k===1?'':'s'}</small></div></div>`;}
 h+='<div class="rp-sec">THEIR ARMY · SURVIVORS</div><div class="rp-chips">';
 for(const ty of ORDER)if(R1[ty])h+=`<span class="rp-chip"><img src="${ICONS[ty]||''}" alt="">${A1[ty]}/${R1[ty]}</span>`;
 h+='</div>';
 const abl=[];
 for(const t of[0,1]){const seen=new Set();for(const k of st.cast[t]){if(seen.has(k))continue;seen.add(k);
  const who=t===0?'Your':'Their',A=ABIL[k];let v='';
  if(k==='heal')v=`restored ${Math.round(st.healed[t])} HP`;
  else if(k==='drums')v=`added ${Math.round(st.drums[t])} bonus damage`;
  else if(k==='stone')v=`absorbed ${Math.round(st.absorbed[t])} damage`;
  else if(k==='gravity')v=`clumped ${st.pulled[t]} enemies`;
  else if(k==='meteor')v=`dealt ${Math.round(st.abDmg[t].meteor||0)} damage · ${st.abKills[t].meteor||0} kills`;
  abl.push(`<div class="rp-ab ${t===0?'me':'op'}"><span>${A.icon}</span>${who} ${A.name} ${v}</div>`);}}
 if(abl.length)h+='<div class="rp-sec">ABILITIES</div>'+abl.join('');
 h+=`<div class="rp-tip">💡 ${buildTip(w,st,R0,A0)}</div>`;
 h+='<div class="rp-foot"><button class="btn sm" id="repNext">'+(G.hp[0]>0&&G.hp[1]>0?'NEXT ROUND':'CONTINUE')+'</button><div class="rp-bar"><i id="repBar"></i></div></div></div>';
 return h;
}
function buildTip(w,st,R0,A0){
 // worst-hit type of yours and what killed it
 let worst=null;for(const ty of ORDER){const tot=R0[ty];if(!tot)continue;const lost=tot-A0[ty]-((st.by[0][ty]||{}).self||0);if(lost>=2&&lost/tot>=.5&&(!worst||lost>worst.lost))worst={ty,lost};}
 if(w!==0&&worst){
  const k=topKey(st.by[0][worst.ty]||{},['self']);
  if(k&&DEFS[k]){const c=PRED[k];return`Their <b>${DEFS[k].name}</b> wiped your ${DEFS[worst.ty].name}. <b>${DEFS[c].name}</b> counter ${DEFS[k].name}${G.roster[0][c]?' — add more':' — draft some'}.`;}
  if(k==='ab:meteor')return`Their <b>Meteor</b> hit the middle of your army. <b>Stone Skin</b> or <b>Heal Circle</b> help you survive it.`;
  if(k==='ab:gravity')return`Their <b>Gravity Well</b> clumped you for a follow-up. Out-number them, or take out their Brutes and Bombers.`;
  if(k==='ringout'||k==='fall'||k==='bump')return`Your ${DEFS[worst.ty].name} got thrown around. Heavier <b>Brutes</b> and <b>Stone Skin</b> hold the line.`;
 }
 // what worked
 let best=null;for(const ty of ORDER){const k=st.kills[0][ty];if(k>=2&&(!best||k>best.k))best={ty,k};}
 if(best){const prey=PREY[best.ty],pk=((st.by[1][prey]||{})[best.ty])||0;
  if(pk>=2)return`Your <b>${DEFS[best.ty].name}</b> counter their ${DEFS[prey].name} (${pk} counter-kills). Keep drafting what beats their army.`;}
 const S=G.seen[1];if(S){const top=ORDER.slice().sort((a,b)=>S[b]-S[a])[0];if(S[top])return`They lean on <b>${DEFS[top].name}</b>. Look for cards marked <b>COUNTERS</b> — ${DEFS[PRED[top]].name} beat them.`;}
 return'Cards marked <b>COUNTERS</b> beat what the enemy is fielding.';
}
async function showResult(w){
 const cls=w===0?'win':w===1?'lose':'draw',txt=w===0?'VICTORY!':w===1?'DEFEAT':'DRAW';
 showOv(`<div class="res ${cls}"><div class="res-t">${txt}</div></div>`,true);
 sfx(w===0?'win':'lose');
 await wait(900);
 const losers=w===0?[1]:w===1?[0]:[0,1];
 for(const t of losers){G.hp[t]=Math.max(0,G.hp[t]-1);breakHeart(t);}sfx('heart');
 await wait(700);
 showOv(buildReport(w));ov.classList.add('rep-on');
 await new Promise(res=>{
  const T=14000,t0=performance.now();let done=false;const bar=$('#repBar');
  const iv=setInterval(()=>{const k=1-(performance.now()-t0)/T;if(bar)bar.style.width=Math.max(0,k*100)+'%';if(k<=0)fin();},100);
  function fin(){if(done)return;done=true;clearInterval(iv);res();}
  $('#repNext').onclick=()=>{initAudio();sfx('pick');fin();};
 });
 hideOv();
}
async function gameOver(){
 const won=G.hp[0]>0&&G.hp[1]===0,draw=G.hp[0]===0&&G.hp[1]===0;
 const d=draw?0:won?randi(26,32):-randi(18,24);const old=G.trophies;G.trophies=Math.max(0,G.trophies+d);$('#tr-me').textContent=G.trophies;
 sfx(won?'win':'lose');
 return new Promise(res=>{
  showOv(`<div class="over ${won?'win':'lose'}"><div class="ov-t">${draw?'DOUBLE KO':won?'CHAMPION!':'ELIMINATED'}</div><div class="ov-s">${draw?'Nobody walks away':won?'You outlasted '+G.oppName:'Knocked out by '+G.oppName}</div><div class="ov-tr">🏆 ${old} → ${G.trophies} <span style="color:${d>=0?'#7dffa0':'#ff8a8a'}">(${d>=0?'+':''}${d})</span></div><div class="ov-st">${G.round} rounds · Final army: ${total(G.roster[0])} troops</div><button class="btn" id="again">PLAY AGAIN</button></div>`);
  $('#again').onclick=()=>{initAudio();sfx('pick');hideOv();res();};
 });
}
function resetGame(){
 clearField();G.round=0;G.hp=[MAX_HP,MAX_HP];G.roster=[emptyRoster(),emptyRoster()];G.abil=[{},{}];G.abilShown=[{},{}];G.lastWinner=-1;G.seen=[null,null];G.st=null;
 renderHearts(0);renderHearts(1);renderChips(0);renderChips(1);renderCounts();setOpStatus('');
}
async function main(){
 await titleScreen();hideOv();
 for(;;){
  resetGame();G.camMode='draft';G.phase='match';await matchmaking();$('#hud').classList.add('on');
  while(G.hp[0]>0&&G.hp[1]>0){
   G.round++;$('#roundLbl').textContent='ROUND '+G.round;
   if(G.round>1){clearField();G.phase='draft';syncArmy(0,true);syncArmy(1,true);G.camMode='draft';await wait(700);}
   G.phase='draft';bigText('ROUND '+G.round);
   await draftRound();
   G.phase='waiting';await waitOpponent();
   G.phase='reveal';const added=syncArmy(1,true);G.abilShown[1]=Object.assign({},G.abil[1]);renderChips(1);renderCounts();G.camMode='battle';
   await wait(added.length?1500:900);
   const w=await runBattle();G.lastWinner=w;G.phase='result';
   await showResult(w);
  }
  G.phase='over';await gameOver();
 }
}

/* ============ boot ============ */
lit=new PSys(new THREE.MeshLambertMaterial(),700);
glow=new PSys(new THREE.MeshBasicMaterial(),600);
buildWorld();renderIcons();onResize();
window.addEventListener('resize',onResize);
renderHearts(0);renderHearts(1);
requestAnimationFrame(t=>{last=t;frame(t);});
main();
window.__vs={buildReport,newStats,G,update,syncArmy,castAbility,startCharges,clearField,genCards,applyCard,aiChoose,units:()=>units,debris,effects};
})();
</script>
